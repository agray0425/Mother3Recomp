# game.toml — MOTHER 3 (GBA), English fan translation (patched JP ROM)
#
# Paths resolve relative to THIS file's directory (variants/mother3en/),
# per runtime.cpp resolve_config_path.
#
# Modelled on EmeraldRecomp's variants/emerald/game.toml.
# Values marked VERIFIED were read out of the Kurausukun/mother3 decomp.
# Values marked CHECK are reasoned defaults — confirm before trusting.

[game]
name           = "MOTHER 3"
short_name     = "mother3en"
default_region = "en"   # loads config/mother3en_en.toml

[bios]
path = "../../gbarecomp/bios/gba_bios.bin"   # override via --bios
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
# The recompiled (LLE) real BIOS is the default and the correctness oracle.
# HLE is opt-in and skips the boot intro; uncomment only if the real BIOS
# is giving you trouble during bring-up.
# hle            = true
# hle_keep_intro = false

[rom]
path = "roms/mother3_en.gba"   # user-provided; gitignore this
# sha1 lives in config/mother3_en.toml

# ── Recompiler program identity (consumed by gba_recompile) ─────────
#
# This file is the BASE config: it owns [program] and [identity] and wins
# over the generated overlay in symbols/mother3_jpn.toml (JP decomp symbols;
# the EN patch reuses the JP code layout). Do not let an
# importer rerun clobber these.
[program]
name         = "MOTHER 3 (EN)"
id           = "mother3en"
load_address = 0x08000000        # VERIFIED — ld_script.ld rom ORIGIN
size         = 0x02000000

entry_pc     = 0x08000000
codegen_shards = 128             # CHECK — Emerald uses 64 for a 16 MB ROM;
                                 # doubled for the 32 MB cart. Raise if the
                                 # per-shard compile blows out your RAM.
# Emit a native resume entry at every instruction boundary so an IRQ or SWI
# return never needs the interpreter or the self-heal path.
static_resume_all = true

[identity]
sha1 = "306FB8874533B0FD0796208FAA8BED2DB4AE77FB"   # EN-patched ROM (not the decomp's JP hash)

[recompiler]
entry_point   = "0x08000000"
seeds         = "symbols/imported_symbols.tsv"
boundaries    = "symbols/function_boundaries.tsv"
out_dir       = "generated"
strict        = true

[save]
type = "flash512"                # 64 KB. Runs and round-trips saves in practice.
                                 # CHECK: the decomp builds an agb_sram driver,
                                 # which hints at SRAM; if saves ever misbehave,
                                 # this is the first value to question.

[runtime]
debug_port    = 19894            # JP build uses 19893; distinct so both can run
window_title  = "Mother3Recomp_FanTranslation"

# Functions the analyzer should be told about explicitly, by mode.
# Leave empty at first; populate only if the fallback census shows
# entry points the symbol import missed.
[functions]
arm   = []
thumb = []

# ── IWRAM code copies (hand-verified 2026-09-24) ─────────────────────
# Found from two save states (overworld + battle): the IWRAM bytes at each
# runtime address match the ROM source exactly, and the ROM holds a literal
# (source, destination) pair for each copy. JP and EN ROMs are identical here.
# These were self-heal misses that the JIT could not lower, so they ran on
# the interpreter every time.

[[code_copy]]
runtime_start = 0x03002EF0
source_start  = 0x080000FC
size          = 0x800
name          = "iwram_irq_core"
note          = "DMA3 copy at 0x0800089C (CNT 0x84000200 = 0x200 words); IRQ handler area"

[[code_copy]]
runtime_start = 0x03004C14
source_start  = 0x0803D59C
size          = 0x100
name          = "iwram_func_0803D59C"
note          = "literal pair at 0x08032F7C"

[[code_copy]]
runtime_start = 0x03004D14
source_start  = 0x0803D5EC
size          = 0x100
name          = "iwram_func_0803D5EC"
note          = "literal pair at 0x08032F84"

[[code_copy]]
runtime_start = 0x03005714
source_start  = 0x080566C8
size          = 0x100
name          = "iwram_func_080566C8"
note          = "literal pair at 0x08050D78"

[[extra_func]]
addr = 0x03002EF0
mode = "arm"
note = "self-heal miss (bridged x2359)"

[[extra_func]]
addr = 0x03003004
mode = "arm"
note = "self-heal miss (bridged x387)"

[[extra_func]]
addr = 0x03004C14
mode = "thumb"
note = "self-heal miss (bridged x612)"

[[extra_func]]
addr = 0x03004D14
mode = "thumb"
note = "copied function entry (literal pair at 0x08032F84)"

[[extra_func]]
addr = 0x03005714
mode = "thumb"
note = "self-heal miss (bridged x350)"

# NOT declared: the misses at 0x03006C1C..0x03006D80. They are the FLASH512
# library's ReadFlash1 / ReadFlash_Core / VerifyFlash_Core, copied from ROM to
# a stack buffer on every call (hence a pointer table in one state, zeros in
# the other). The slot moves, so a fixed entry here would be unsafe;
# mother3_ram_dispatch in src/main.cpp runs byte-verified copies through the
# ROM routines' static translations instead (FULLY_STATIC with in-game saves).

# ── Moved from the old importer overlay (2026-09-24) ─────────────────
# The current decomp build exports SoundMainRAM_Buffer with size 0, so the
# importer can no longer derive this copy or the header data range. They live
# here in the hand-authored base config so symbol re-imports cannot drop them.

[[code_copy]]
runtime_start = 0x03000000
source_start  = 0x0808ED80
size          = 0x800
name          = "SoundMainRAM_Buffer"
note          = "m4a SoundMainRAM (ROM 0x0808ED81 thumb, 932 bytes) copied to IWRAM"

[[extra_func]]
addr = 0x03000000
mode = "thumb"
name = "soundmainram_buffer_iwram"
note = "IWRAM-resident copy of SoundMainRAM"

[[data_range]]
start = 0x08000004
end   = 0x080000C0
note  = "cartridge header (logo, title, checksums)"
